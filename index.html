<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الحضور</title>

  <meta name="theme-color" content="#2563eb">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-600: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.5;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 28px auto 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .header h2 {
      margin: 0;
      font-weight: 700;
    }

    .header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 14px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    #reader {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    #reader > div {
      border-radius: 12px;
      overflow: hidden;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    select,
    button,
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
      transition:
        border-color 120ms ease,
        box-shadow 120ms ease,
        transform 60ms ease;
    }

    input::placeholder {
      color: #9ca3af;
    }

    select:focus,
    input:focus {
      border-color: rgba(37, 99, 235, 0.55);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    @media (max-width: 500px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      background: var(--primary-600);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-ghost {
      background: #fff;
      color: var(--text);
    }

    .btn-ghost:hover {
      border-color: #cbd5e1;
      background: #f9fafb;
    }

    #status {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      color: var(--muted);
      background: #fafafa;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      word-break: break-word;
    }

    #studentName {
      margin: 18px 0 0;
      font-weight: 700;
      text-align: center;
      font-size: 18px;
    }

    #attendanceTable {
      margin-top: 15px;
      overflow-x: auto;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1000px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      border-left: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th:first-child,
    td:first-child {
      border-right: 0;
    }

    th {
      background: #f8fafc;
      color: #0f172a;
      font-size: 13px;
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      font-size: 18px;
    }

    .present {
      color: var(--success);
    }

    .absent {
      color: var(--danger);
    }

    .spinner {
      border: 3px solid #e5e7eb;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.9s linear infinite;
      display: inline-block;
      vertical-align: middle;
      flex: 0 0 auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="header">
      <h2>تانية ثانوي</h2>
      <p>تسجيل الحضور بالباركود أو بالكتابة اليدوية</p>
    </div>

    <section class="card grid">

      <!-- ========================= -->
      <!-- Scanner -->
      <!-- ========================= -->

      <div>
        <div id="reader"></div>
      </div>

      <!-- ========================= -->
      <!-- Controls -->
      <!-- ========================= -->

      <div class="controls">

        <div>
          <label for="attendanceType">نوع الحضور</label>

          <select id="attendanceType">

            <!-- H -->
            <option value="الحضور الاول">
              الحضور الأول
            </option>

            <!-- I -->
            <option value="الحضور الثاني">
              الحضور الثاني
            </option>

            <!-- J -->
            <option value="الحضور الثالث">
              الحضور الثالث
            </option>

            <!-- K -->
            <option value="الحضور الرابع">
              الحضور الرابع
            </option>

            <!-- L -->
            <option value="الحضور الخامس">
              الحضور الخامس
            </option>

            <!-- M -->
            <option value="الحضور السادس">
              الحضور السادس
            </option>

            <!-- N -->
            <option value="الحضور السابع">
              الحضور السابع
            </option>

            <!-- O -->
            <option value="الحضور الثامن">
              الحضور الثامن
            </option>

            <!-- P -->
            <option value="الحضور الشامل">
              الحضور الشامل
            </option>

            <!-- Q -->
            <option value="الحضور التاسع">
              الحضور التاسع
            </option>

            <!-- R -->
            <option value="الحضور العاشر">
              الحضور العاشر
            </option>

            <!-- S -->
            <option value="الحضور الحادي عشر">
              الحضور الحادي عشر
            </option>

            <!-- T -->
            <option value="الحضور الثاني عشر">
              الحضور الثاني عشر
            </option>

            <!-- U -->
            <option value="الحضور الثالث عشر">
              الحضور الثالث عشر
            </option>

            <!-- V -->
            <option value="الحضور الرابع عشر">
              الحضور الرابع عشر
            </option>

            <!-- W -->
            <option value="الحضور الخامس عشر">
              الحضور الخامس عشر
            </option>

            <!-- X -->
            <option value="الحضور السادس عشر">
              الحضور السادس عشر
            </option>

            <!-- Y -->
            <option value="الحضور السابع عشر">
              الحضور السابع عشر
            </option>

            <!-- Z -->
            <option value="الحضور الثامن عشر">
              الحضور الثامن عشر
            </option>

            <!-- AA -->
            <option value="الحضور التاسع عشر">
              الحضور التاسع عشر
            </option>

            <!-- AB -->
            <option value="الحضور العشرين">
              الحضور العشرين
            </option>

          </select>

        </div>

        <!-- ========================= -->
        <!-- Manual Input -->
        <!-- ========================= -->

        <div>

          <label for="manualBarcode">
            إدخال يدوي
          </label>

          <input
            type="text"
            id="manualBarcode"
            placeholder="اكتب الكود أو كلمة المرور هنا"
            autofocus
            inputmode="numeric"
            autocomplete="one-time-code"
            oninput="checkBarcode(this)"
          >

        </div>

        <!-- ========================= -->
        <!-- Buttons -->
        <!-- ========================= -->

        <div class="actions">

          <button
            class="btn-primary"
            onclick="startScanner()">
            بدء المسح
          </button>

          <button
            class="btn-ghost"
            onclick="submitManually()">
            تسجيل بالكود
          </button>

        </div>

        <p id="status"></p>

      </div>

    </section>

    <!-- Student -->
    <p id="studentName"></p>

    <!-- Attendance -->
    <div id="attendanceTable"></div>

  </main>


  <script>

    // =========================================================
    // GOOGLE APPS SCRIPT URL
    // =========================================================

    const scriptURL =
      "https://script.google.com/macros/s/AKfycbwGfAFHw0Ks2xuvdpM5-b23srM7vgozZA3pfHrpwXM8N7SQpT8n1WXEG0BCjOxlxAr1/exec";


    // =========================================================
    // Scanner variables
    // =========================================================

    let scanner = null;

    let lastScanned = "";

    let lastTime = 0;


    // =========================================================
    // Offline queue
    // =========================================================

    const PENDING_KEY = "pendingAttendance:v1";


    function loadPending() {

      try {

        const raw =
          localStorage.getItem(PENDING_KEY);

        const arr =
          raw ? JSON.parse(raw) : [];

        return Array.isArray(arr)
          ? arr
          : [];

      } catch {

        return [];

      }

    }


    function savePending(items) {

      try {

        localStorage.setItem(
          PENDING_KEY,
          JSON.stringify(items)
        );

      } catch {

        // Ignore localStorage errors

      }

    }


    function queueSubmission(
      barcode,
      attendanceType
    ) {

      const items =
        loadPending();

      items.push({

        barcode:
          String(barcode).trim(),

        attendanceType:
          String(attendanceType).trim(),

        ts:
          Date.now()

      });

      savePending(items);

    }


    // =========================================================
    // Send offline requests
    // =========================================================

    async function flushPending() {

      if (!navigator.onLine) {
        return;
      }

      const items =
        loadPending();

      if (!items.length) {
        return;
      }

      const remaining = [];


      for (const item of items) {

        try {

          const response =
            await fetch(
              scriptURL,
              {
                method: "POST",

                body:
                  new URLSearchParams({

                    barcode:
                      item.barcode,

                    attendanceType:
                      item.attendanceType

                  })
              }
            );


          if (!response.ok) {

            throw new Error(
              "HTTP error " +
              response.status
            );

          }


          const data =
            await response.json();


          // If Apps Script says that the student
          // does not exist, don't keep retrying forever.
          if (
            data.message ===
            "البطاقة غير موجودة!"
          ) {

            continue;

          }


        } catch (error) {

          remaining.push(item);

        }

      }


      savePending(remaining);

    }


    window.addEventListener(
      "online",
      () => {

        flushPending();

      }
    );


    // =========================================================
    // Manual barcode input
    // =========================================================

    function checkBarcode(input) {

      // Keep numbers only
      input.value =
        input.value.replace(/\D/g, "");


      // Automatically submit after 5 digits
      if (
        input.value.length === 5
      ) {

        submitManually();

        input.value = "";

      }

    }


    // =========================================================
    // Start QR / Barcode scanner
    // =========================================================

    function startScanner() {

      if (scanner) {

        return;

      }


      scanner =
        new Html5QrcodeScanner(
          "reader",
          {
            fps: 30,
            qrbox: 250
          }
        );


      scanner.render(

        onScanSuccess,

        (errorMessage) => {

          console.warn(
            errorMessage
          );

        }

      );

    }


    // =========================================================
    // Scanner success
    // =========================================================

    function onScanSuccess(
      decodedText
    ) {

      const now =
        Date.now();


      // Prevent duplicate scanning
      if (
        decodedText === lastScanned &&
        now - lastTime < 1000
      ) {

        return;

      }


      lastScanned =
        decodedText;

      lastTime =
        now;


      const attendanceType =
        document
          .getElementById(
            "attendanceType"
          )
          .value;


      submitData(
        decodedText,
        attendanceType
      );

    }


    // =========================================================
    // Manual submit
    // =========================================================

    function submitManually() {

      const input =
        document.getElementById(
          "manualBarcode"
        );


      const barcode =
        input.value.trim();


      const attendanceType =
        document
          .getElementById(
            "attendanceType"
          )
          .value;


      if (!barcode) {

        document
          .getElementById("status")
          .innerText =
          "من فضلك اكتب الكود";

        return;

      }


      submitData(
        barcode,
        attendanceType
      );


      input.value = "";

    }


    // =========================================================
    // Loading
    // =========================================================

    function showLoading() {

      document
        .getElementById("status")
        .innerHTML =
        'جارٍ التحقق... <span class="spinner"></span>';

    }


    function hideLoading(message) {

      document
        .getElementById("status")
        .innerText =
        message;

    }


    // =========================================================
    // Submit data to Apps Script
    // =========================================================

    function submitData(
      barcode,
      attendanceType
    ) {

      // Clear old result

      document
        .getElementById(
          "studentName"
        )
        .innerText = "";


      document
        .getElementById(
          "attendanceTable"
        )
        .innerHTML = "";


      barcode =
        String(barcode).trim();


      attendanceType =
        String(attendanceType).trim();


      if (!barcode) {

        hideLoading(
          "الكود غير صحيح!"
        );

        return;

      }


      // =====================================================
      // Offline
      // =====================================================

      if (!navigator.onLine) {

        queueSubmission(
          barcode,
          attendanceType
        );


        hideLoading(
          "تم حفظ التسجيل أوفلاين وسيتم الإرسال عند عودة الإنترنت"
        );


        return;

      }


      showLoading();


      // =====================================================
      // POST
      // =====================================================

      fetch(
        scriptURL,
        {

          method: "POST",

          body:
            new URLSearchParams({

              barcode:
                barcode,

              attendanceType:
                attendanceType

            })

        }
      )

      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              "HTTP error " +
              response.status
            );

          }

          return response.json();

        }
      )

      .then(
        data => {

          // ===============================================
          // Message from Apps Script
          // ===============================================

          hideLoading(
            data.message ||
            "تم تنفيذ العملية"
          );


          // ===============================================
          // Student name
          // ===============================================

          if (
            data.studentName
          ) {

            document
              .getElementById(
                "studentName"
              )
              .innerText =
              "الطالب: " +
              data.studentName;

          }


          // ===============================================
          // Attendance
          // ===============================================

          if (
            Array.isArray(
              data.attendance
            )
          ) {

            renderAttendanceTable(
              data.attendance
            );

          }

        }
      )

      .catch(
        error => {

          console.error(
            "Error:",
            error
          );


          // Save request for retry

          queueSubmission(
            barcode,
            attendanceType
          );


          hideLoading(
            "تعذر الاتصال. تم حفظ التسجيل وسيتم الإرسال تلقائيًا"
          );

        }
      );

    }


    // =========================================================
    // Attendance table
    //
    // MUST MATCH Apps Script:
    //
    // H  = الحضور الاول
    // I  = الحضور الثاني
    // J  = الحضور الثالث
    // K  = الحضور الرابع
    // L  = الحضور الخامس
    // M  = الحضور السادس
    // N  = الحضور السابع
    // O  = الحضور الثامن
    // P  = الحضور الشامل
    // Q  = الحضور التاسع
    // R  = الحضور العاشر
    // S  = الحضور الحادي عشر
    // T  = الحضور الثاني عشر
    // U  = الحضور الثالث عشر
    // V  = الحضور الرابع عشر
    // W  = الحضور الخامس عشر
    // X  = الحضور السادس عشر
    // Y  = الحضور السابع عشر
    // Z  = الحضور الثامن عشر
    // AA = الحضور التاسع عشر
    // AB = الحضور العشرين
    // =========================================================

    function renderAttendanceTable(
      attendanceArray
    ) {

      const headers = [

        "الحضور الأول",

        "الحضور الثاني",

        "الحضور الثالث",

        "الحضور الرابع",

        "الحضور الخامس",

        "الحضور السادس",

        "الحضور السابع",

        "الحضور الثامن",

        "الحضور الشامل",

        "الحضور التاسع",

        "الحضور العاشر",

        "الحضور الحادي عشر",

        "الحضور الثاني عشر",

        "الحضور الثالث عشر",

        "الحضور الرابع عشر",

        "الحضور الخامس عشر",

        "الحضور السادس عشر",

        "الحضور السابع عشر",

        "الحضور الثامن عشر",

        "الحضور التاسع عشر",

        "الحضور العشرين"

      ];


      let table =
        "<table>";


      // =====================================================
      // Header
      // =====================================================

      table +=
        "<thead><tr>";


      headers.forEach(
        header => {

          table +=
            `<th>${header}</th>`;

        }
      );


      table +=
        "</tr></thead>";


      // =====================================================
      // Attendance values
      // =====================================================

      table +=
        "<tbody><tr>";


      for (
        let i = 0;
        i < headers.length;
        i++
      ) {

        const value =
          Array.isArray(
            attendanceArray
          )
            ? attendanceArray[i]
            : "";


        if (
          value === "✓"
        ) {

          table +=
            '<td class="present">✅</td>';

        } else {

          table +=
            '<td class="absent">❌</td>';

        }

      }


      table +=
        "</tr></tbody>";


      table +=
        "</table>";


      document
        .getElementById(
          "attendanceTable"
        )
        .innerHTML =
        table;

    }


    // =========================================================
    // Try sending pending requests on page load
    // =========================================================

    flushPending();

  </script>

</body>

</html>
